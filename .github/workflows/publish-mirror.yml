# Publishes release assets and API-metadata snapshots to the download
# mirror bucket (Cloudflare R2 `oryxis-dl`, served as dl.oryxis.app and
# fronted for mainland China by Tencent EdgeOne at dl-cn.oryxis.app).
#
# The app's `net_mirror::asset_path` maps GitHub URLs onto this layout;
# keep the two in lockstep:
#
#   fonts/<file>              pinned CJK fonts (from google/fonts)
#   plugins/<provider>.json   plugin catalog, the app's PRIMARY manifest
#                             source (git is the first leg, this the
#                             second); mirrors the repo's plugins/ dir
#   releases/<tag>/<asset>    release assets incl. .sig sidecars
#   releases/latest.json      snapshot of GET repos/.../releases/latest
#   releases/nightly.json     snapshot of GET repos/.../releases/tags/nightly-latest
#                             (file name kept from the pre-2026-07-16
#                             `nightly` tag so old binaries' mirror
#                             fallback keeps resolving)
#   releases/index.json       snapshot of GET repos/.../releases?per_page=30
#
# Mirror content never needs to be trusted by clients: every asset is
# SHA-256 and/or Ed25519 verified against keys baked into the app.
#
# Reusable: every release workflow calls this with its tag after the
# GitHub release is published, so the snapshots always reflect the
# post-release API state.

name: Publish to download mirror

# Least privilege: the job only READS the repo (release assets + API
# snapshots); everything it writes goes to the R2 bucket via the S3
# credentials, never through the GitHub token.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose assets are synced to the mirror
        required: true
        type: string
  # Manual runs seed the mirror with releases that predate this
  # workflow (v0.9.0, mcp-v0.1.2, ...): one dispatch per tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose assets are synced to the mirror
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUCKET: oryxis-dl
      # The account id is not a secret (it is visible in every R2 URL);
      # the credentials below are.
      AWS_ENDPOINT_URL: https://acd6c60770173234a03c6311de016dff.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # The only thing this job needs from the repository is the purge
      # helper, so it takes that directory and nothing else: everything
      # published here comes from the release's own assets, which is why
      # the rest of the job has never checked anything out. It runs first
      # because a checkout cleans the directory it lands in, and by the
      # time the assets are downloaded there is something there to lose.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p "assets/releases/$TAG"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "assets/releases/$TAG"
          # Debug-symbol assets stay on GitHub only. The mirror exists so
          # blocked networks can still RUN and UPDATE the app; symbols are
          # a one-off diagnostic download, and mirroring hundreds of MB of
          # DWARF on every push to main would dominate the bucket.
          rm -f "assets/releases/$TAG"/*-debug.tar.xz \
                "assets/releases/$TAG"/*-debug.tar.xz.sig
          ls -la "assets/releases/$TAG"

      - name: Snapshot release metadata
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api?per_page=30" > assets/releases/index.json
          # latest / nightly may 404 before the first matching release
          # exists; skip rather than publish an error body.
          gh api "$api/latest" > assets/releases/latest.json || rm -f assets/releases/latest.json
          gh api "$api/tags/nightly-latest" > assets/releases/nightly.json || rm -f assets/releases/nightly.json

      - name: Mirror the pinned fonts (CJK + terminal pack)
        run: |
          set -euo pipefail
          # Bucket keys are the DECODED file names ([wght], not %5B):
          # the server percent-decodes the request path before matching
          # keys, so the app's %5B URLs resolve to these objects. The
          # pinned source URLs live in crates/oryxis-app/src/fonts.rs.
          commit=c89741abbf4eeabce432c3ed2fd7dc28b022701e
          base="https://raw.githubusercontent.com/google/fonts/$commit/ofl"
          # Terminal font pack (issue #109): pinned at the nerd-fonts
          # v3.4.0 tag commit, the last with in-repo patched TTFs.
          nf_commit=fa7b859994228a9c8759f99c55a8d31ee92a1b5e
          nf="https://raw.githubusercontent.com/ryanoasis/nerd-fonts/$nf_commit/patched-fonts"
          mkdir -p assets/fonts
          declare -A fonts=(
            ["NotoSansKR[wght].ttf"]="$base/notosanskr/NotoSansKR%5Bwght%5D.ttf"
            ["NotoSansSC[wght].ttf"]="$base/notosanssc/NotoSansSC%5Bwght%5D.ttf"
            ["NotoSansJP[wght].ttf"]="$base/notosansjp/NotoSansJP%5Bwght%5D.ttf"
            ["NotoSansTC[wght].ttf"]="$base/notosanstc/NotoSansTC%5Bwght%5D.ttf"
            ["JetBrainsMonoNerdFont-Regular.ttf"]="$nf/JetBrainsMono/Ligatures/Regular/JetBrainsMonoNerdFont-Regular.ttf"
            ["CaskaydiaCoveNerdFont-Regular.ttf"]="$nf/CascadiaCode/CaskaydiaCoveNerdFont-Regular.ttf"
            ["FiraCodeNerdFont-Regular.ttf"]="$nf/FiraCode/Regular/FiraCodeNerdFont-Regular.ttf"
            ["HackNerdFont-Regular.ttf"]="$nf/Hack/Regular/HackNerdFont-Regular.ttf"
            ["MesloLGSNerdFont-Regular.ttf"]="$nf/Meslo/S/Regular/MesloLGSNerdFont-Regular.ttf"
            ["RobotoMonoNerdFont-Regular.ttf"]="$nf/RobotoMono/Regular/RobotoMonoNerdFont-Regular.ttf"
            ["UbuntuMonoNerdFont-Regular.ttf"]="$nf/UbuntuMono/Regular/UbuntuMonoNerdFont-Regular.ttf"
            ["IosevkaNerdFont-Regular.ttf"]="$nf/Iosevka/IosevkaNerdFont-Regular.ttf"
            # The heavier faces (issue #155): one file per weight, and
            # only the weight the user picks is ever fetched. Three
            # families stop at Bold upstream, which is why their Medium
            # and SemiBold rows are missing rather than forgotten.
            ["JetBrainsMonoNerdFont-Medium.ttf"]="$nf/JetBrainsMono/Ligatures/Medium/JetBrainsMonoNerdFont-Medium.ttf"
            ["JetBrainsMonoNerdFont-SemiBold.ttf"]="$nf/JetBrainsMono/Ligatures/SemiBold/JetBrainsMonoNerdFont-SemiBold.ttf"
            ["JetBrainsMonoNerdFont-Bold.ttf"]="$nf/JetBrainsMono/Ligatures/Bold/JetBrainsMonoNerdFont-Bold.ttf"
            ["CaskaydiaCoveNerdFont-SemiBold.ttf"]="$nf/CascadiaCode/CaskaydiaCoveNerdFont-SemiBold.ttf"
            ["CaskaydiaCoveNerdFont-Bold.ttf"]="$nf/CascadiaCode/CaskaydiaCoveNerdFont-Bold.ttf"
            ["FiraCodeNerdFont-Medium.ttf"]="$nf/FiraCode/Medium/FiraCodeNerdFont-Medium.ttf"
            ["FiraCodeNerdFont-SemiBold.ttf"]="$nf/FiraCode/SemiBold/FiraCodeNerdFont-SemiBold.ttf"
            ["FiraCodeNerdFont-Bold.ttf"]="$nf/FiraCode/Bold/FiraCodeNerdFont-Bold.ttf"
            ["HackNerdFont-Bold.ttf"]="$nf/Hack/Bold/HackNerdFont-Bold.ttf"
            ["MesloLGSNerdFont-Bold.ttf"]="$nf/Meslo/S/Bold/MesloLGSNerdFont-Bold.ttf"
            ["RobotoMonoNerdFont-Medium.ttf"]="$nf/RobotoMono/Medium/RobotoMonoNerdFont-Medium.ttf"
            ["RobotoMonoNerdFont-SemiBold.ttf"]="$nf/RobotoMono/SemiBold/RobotoMonoNerdFont-SemiBold.ttf"
            ["RobotoMonoNerdFont-Bold.ttf"]="$nf/RobotoMono/Bold/RobotoMonoNerdFont-Bold.ttf"
            ["UbuntuMonoNerdFont-Bold.ttf"]="$nf/UbuntuMono/Bold/UbuntuMonoNerdFont-Bold.ttf"
            ["IosevkaNerdFont-Medium.ttf"]="$nf/Iosevka/IosevkaNerdFont-Medium.ttf"
            ["IosevkaNerdFont-SemiBold.ttf"]="$nf/Iosevka/IosevkaNerdFont-SemiBold.ttf"
            ["IosevkaNerdFont-Bold.ttf"]="$nf/Iosevka/IosevkaNerdFont-Bold.ttf"
          )
          for key in "${!fonts[@]}"; do
            # Immutable, commit-pinned content: skip when already there.
            if aws s3api head-object --bucket "$BUCKET" --key "fonts/$key" >/dev/null 2>&1; then
              echo "fonts/$key already mirrored"
              continue
            fi
            curl -fsSL "${fonts[$key]}" -o "assets/fonts/$key"
            aws s3 cp "assets/fonts/$key" "s3://$BUCKET/fonts/$key"
          done

      - name: Publish the plugin catalog entry
        run: |
          set -euo pipefail
          # A plugin release tag is `<provider>-v<version>` and its own
          # `<provider>.json` is already among the assets downloaded
          # above, so the catalog copy needs no checkout of main: the
          # file here IS the one the manifest job just built and
          # committed. App-release tags (`v0.14.0`) match nothing and
          # skip, which is why this greps the tag instead of assuming.
          provider="${TAG%%-v*}"
          src="assets/releases/$TAG/$provider.json"
          if [ "$provider" = "$TAG" ] || [ ! -f "$src" ]; then
            echo "no catalog entry for $TAG"
            exit 0
          fi
          # Same short TTL as the release snapshots: a catalog entry is
          # replaced in place on every plugin release, so a long cache
          # would hide a new version from the mirror leg for hours.
          aws s3 cp "$src" "s3://$BUCKET/plugins/$provider.json" \
            --content-type application/json \
            --cache-control "public, max-age=300"
          curl -fsS -o /dev/null -w "catalog: HTTP %{http_code}\n" \
            "https://dl.oryxis.app/plugins/$provider.json"

      - name: Upload to the mirror bucket
        run: |
          set -euo pipefail
          aws s3 sync "assets/releases/$TAG" "s3://$BUCKET/releases/$TAG"
          for f in index.json latest.json nightly.json; do
            if [ -f "assets/releases/$f" ]; then
              aws s3 cp "assets/releases/$f" "s3://$BUCKET/releases/$f" \
                --content-type application/json \
                --cache-control "public, max-age=300"
            fi
          done

      # The metadata snapshots are written with `max-age=300`, which the
      # Cloudflare side honours and an EdgeOne node does not: it caches on
      # its own TTL and goes on answering with whatever it holds.
      # `latest.json` is what every client reads on an update check, so it
      # is the file that stays hot and therefore the one that goes stale,
      # and mainland China is then told about the previous release for as
      # long as that copy lives. Assets are safe by construction (a new tag
      # is a new path nobody has cached); only these three names are
      # rewritten in place, so only these three are purged.
      - name: Purge the China edge
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TENCENT_SECRET_ID:-}" ]; then
            echo "::warning::no EdgeOne credentials; dl-cn.oryxis.app keeps serving its cached metadata until purged by hand"
            exit 0
          fi
          # Cheap, and it fails on the one error the API cannot tell apart
          # from a bad key: a malformed canonical request signs cleanly and
          # is refused as an authentication failure.
          python3 .github/scripts/edgeone_purge.py --selftest
          python3 .github/scripts/edgeone_purge.py \
            https://dl-cn.oryxis.app/releases/latest.json \
            https://dl-cn.oryxis.app/releases/nightly.json \
            https://dl-cn.oryxis.app/releases/index.json

      - name: Verify through the public endpoint
        env:
          PURGED: ${{ secrets.TENCENT_SECRET_ID != '' }}
        run: |
          set -euo pipefail
          # One asset fetched back through dl.oryxis.app proves the
          # bucket -> custom domain chain end to end. No pipes into
          # head here: closing curl's stdout early is a SIGPIPE (exit
          # 23) under pipefail.
          probe=$(ls "assets/releases/$TAG" | head -1)
          curl -fsSI -o /dev/null -w "asset: HTTP %{http_code}\n" \
            "https://dl.oryxis.app/releases/$TAG/$probe"
          curl -fsS --range 0-199 -o /dev/null -w "index: HTTP %{http_code}\n" \
            "https://dl.oryxis.app/releases/index.json"

          # A 200 says the file is reachable, not that it is THIS release:
          # a stale edge answers 200 all day with last month's tag. So the
          # check reads the tag out of the body, on both legs, which is the
          # question a user's update check actually asks. Only for `v*`
          # tags, since plugin releases do not move `latest.json`.
          case "$TAG" in
            v*)
              for host in dl.oryxis.app dl-cn.oryxis.app; do
                got=""
                # The purge above is asynchronous, so the China leg is
                # given time to come back rather than read once and fail.
                for _ in 1 2 3 4 5 6; do
                  got=$(curl -fsS "https://$host/releases/latest.json" \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))') || true
                  [ "$got" = "$TAG" ] && break
                  sleep 10
                done
                if [ "$got" = "$TAG" ]; then
                  echo "$host: latest.json is $got"
                elif [ "$host" = "dl-cn.oryxis.app" ] && [ "$PURGED" != "true" ]; then
                  echo "::warning::$host still serves $got; purge its cache or add the EdgeOne credentials"
                else
                  echo "::error::$host serves $got for latest.json, expected $TAG"
                  exit 1
                fi
              done
              ;;
          esac
          echo "mirror OK"
