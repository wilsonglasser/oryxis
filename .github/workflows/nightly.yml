name: Nightly

# Rolling per-commit build of just the main `oryxis` app (no plugins,
# no installers). Each successful run replaces the `nightly-latest`
# GitHub Release so the link to the latest unstable binary never moves.
#
# The rolling tag was `nightly` until 2026-07-16: a release published
# while "release immutability" was enabled burned that tag name
# PERMANENTLY (GitHub reserves a tag ever used by an immutable release,
# even after the release and tag are deleted and the setting is turned
# off). Never enable release immutability on this repo while a rolling
# tag exists, and never reuse the name `nightly` for a tag. The mirror
# snapshot keeps the `releases/nightly.json` name so pre-rename
# binaries still find updates through the Auto mirror fallback.

on:
  push:
    branches: [main]
    # Skip pure docs / screenshot churn since the
    # binary doesn't change. CI still runs on those via ci.yml.
    paths-ignore:
      - '**/*.md'
      - 'resources/screen_*.png'
      - 'resources/screen_*.gif'
      - '.github/workflows/release*.yml'

# Cancel an in-flight nightly when a newer commit lands. The rolling
# `nightly-latest` release would just be overwritten anyway, so the
# older run is wasted compute.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Stamp the binary as a nightly build at the exact commit. `build.rs`
  # bakes these into ORYXIS_CHANNEL / ORYXIS_GIT_SHA so the in-app
  # nightly updater can tell what it's running and compare against the
  # rolling release's target commit.
  ORYXIS_BUILD_CHANNEL: nightly
  ORYXIS_GIT_SHA: ${{ github.sha }}

jobs:
  build-linux-x86:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-x86-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-symbols -p oryxis-app
      # Split debuginfo out of the binary, then strip it. What ships
      # carries no more symbols than `strip = true` left it, plus one
      # added `.gnu_debuglink` section naming its symbol file; what is
      # NEW is that the symbols survive as their own asset, so a `gdb`
      # backtrace from the field can be resolved instead of printing
      # `??` (issue #104). gdb checks the debuglink CRC, so the pair
      # only works together: whoever collects a stack downloads the
      # binary and its `-debug.tar.xz` in the same sitting, because
      # `nightly-latest` is replaced on every push to main.
      - name: Split debug symbols
        run: |
          set -euo pipefail
          BIN=target/release-with-symbols/oryxis
          objcopy --only-keep-debug "$BIN" oryxis.debug
          objcopy --strip-all --add-gnu-debuglink=oryxis.debug "$BIN" oryxis-stripped
          # -T0: xz defaults to one thread, and a release DWARF blob
          # is big enough for that to cost minutes of nightly time.
          XZ_OPT=-T0 tar cJf oryxis-nightly-linux-x86_64-debug.tar.xz oryxis.debug
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp oryxis-stripped dist/oryxis
          cp README.md resources/logo_64.png resources/oryxis.desktop dist/
          cd dist && tar czf ../oryxis-nightly-linux-x86_64.tar.gz *
          # Bare binary asset for in-app self-update (no installer for nightly).
          cd .. && cp oryxis-stripped oryxis-nightly-linux-x86_64.bin
      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-nightly-linux-x86_64
          path: |
            oryxis-nightly-linux-x86_64.tar.gz
            oryxis-nightly-linux-x86_64.bin
            oryxis-nightly-linux-x86_64-debug.tar.xz

  build-linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-arm-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-symbols -p oryxis-app
      # Same split as the x86_64 job above; see the comment there.
      - name: Split debug symbols
        run: |
          set -euo pipefail
          BIN=target/release-with-symbols/oryxis
          objcopy --only-keep-debug "$BIN" oryxis.debug
          objcopy --strip-all --add-gnu-debuglink=oryxis.debug "$BIN" oryxis-stripped
          # -T0: xz defaults to one thread, and a release DWARF blob
          # is big enough for that to cost minutes of nightly time.
          XZ_OPT=-T0 tar cJf oryxis-nightly-linux-aarch64-debug.tar.xz oryxis.debug
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp oryxis-stripped dist/oryxis
          cp README.md resources/logo_64.png resources/oryxis.desktop dist/
          cd dist && tar czf ../oryxis-nightly-linux-aarch64.tar.gz *
          cd .. && cp oryxis-stripped oryxis-nightly-linux-aarch64.bin
      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-nightly-linux-aarch64
          path: |
            oryxis-nightly-linux-aarch64.tar.gz
            oryxis-nightly-linux-aarch64.bin
            oryxis-nightly-linux-aarch64-debug.tar.xz

  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --release -p oryxis-app
      - name: Package tarball + bare binary
        run: |
          mkdir -p dist
          cp target/release/oryxis dist/
          cp README.md resources/logo_64.png dist/
          cd dist && tar czf ../oryxis-nightly-macos-aarch64.tar.gz *
          cd .. && cp target/release/oryxis oryxis-nightly-macos-aarch64.bin
      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-nightly-macos-aarch64
          path: |
            oryxis-nightly-macos-aarch64.tar.gz
            oryxis-nightly-macos-aarch64.bin

  build-windows-x86:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-x86-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --profile release-with-split-debuginfo-packed -p oryxis-app
      - name: Package zip & pdb's + bare exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release-with-split-debuginfo-packed\oryxis.exe dist\
          Copy-Item README.md dist\
          Copy-Item resources\logo_64.png dist\
          Compress-Archive -Path dist\* -DestinationPath oryxis-nightly-windows-x86_64.zip
          New-Item -ItemType Directory -Force -Path pdb
          Copy-Item -Path target\release-with-split-debuginfo-packed\*.pdb pdb\
          Compress-Archive -Path pdb\* -DestinationPath oryxis-nightly-windows-x86_64-pdb.zip
          # Bare exe asset for in-app self-update (no installer for nightly).
          Copy-Item target\release-with-split-debuginfo-packed\oryxis.exe oryxis-nightly-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-nightly-windows-x86_64
          path: |
            oryxis-nightly-windows-x86_64.zip
            oryxis-nightly-windows-x86_64-pdb.zip
            oryxis-nightly-windows-x86_64.exe

  build-windows-arm:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-arm-nightly-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --release --target aarch64-pc-windows-msvc -p oryxis-app
      - name: Package portable zip + bare exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\aarch64-pc-windows-msvc\release\oryxis.exe dist\
          Copy-Item README.md dist\
          Copy-Item resources\logo_64.png dist\
          Compress-Archive -Path dist\* -DestinationPath oryxis-nightly-windows-aarch64.zip
          # Bare exe asset for in-app self-update (no installer for nightly).
          Copy-Item target\aarch64-pc-windows-msvc\release\oryxis.exe oryxis-nightly-windows-aarch64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-nightly-windows-aarch64
          path: |
            oryxis-nightly-windows-aarch64.zip
            oryxis-nightly-windows-aarch64.exe

  publish:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86
      - build-linux-arm
      - build-macos-arm
      - build-windows-x86
      - build-windows-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the tag refs locally so `git tag -f nightly` finds
          # the previous one to overwrite, and so the SHA shows up in
          # release notes.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute build metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          STAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      # Detached Ed25519 signature per asset (`<asset>.sig`, base64).
      # The in-app nightly self-update verifies the bare binary against
      # the baked-in PROD_PUBKEY before swapping it in.
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign nightly assets
        env:
          ORYXIS_SIGNING_KEY: ${{ secrets.ORYXIS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p oryxis-plugin-signer
          for f in dist/*; do
            case "$f" in *.sig) continue ;; esac
            ./target/release/oryxis-plugin-signer sign "$f" > "$f.signinfo"
            grep '^signature_b64' "$f.signinfo" | awk '{print $3}' > "$f.sig"
            rm "$f.signinfo"
          done
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drop any previous nightly release and its tag (suppress 404
          # so the very first run still succeeds). `--cleanup-tag`
          # nukes the rolling tag so the next `gh release create` can
          # recreate it pointing at the new commit.
          gh release delete nightly-latest --yes --cleanup-tag 2>/dev/null || true

          NOTES=$(cat <<NOTE
          Automated nightly build of the \`oryxis\` app, no plugins or installers.

          - **Commit:** \`${{ github.sha }}\` (\`${{ steps.meta.outputs.sha_short }}\`)
          - **Built:** ${{ steps.meta.outputs.stamp }}

          Each push to \`main\` overwrites this release. For stable
          builds and Windows installers, grab the [latest tagged
          release](https://github.com/${{ github.repository }}/releases/latest).
          NOTE
          )

          gh release create nightly-latest \
            --prerelease \
            --title "Nightly (${{ steps.meta.outputs.sha_short }})" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            dist/*

