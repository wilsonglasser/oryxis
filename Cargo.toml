[workspace]
resolver = "2"
members = [
    "crates/oryxis-core",
    "crates/oryxis-ssh",
    "crates/oryxis-archive",
    "crates/oryxis-telnet",
    "crates/oryxis-serial",
    "crates/oryxis-mosh",
    "crates/oryxis-zmodem",
    "crates/oryxis-terminal",
    "crates/oryxis-vault",
    "crates/oryxis-biometric",
    "crates/oryxis-plugin-protocol",
    "crates/oryxis-plugin-signer",
    "crates/oryxis-app",
    "crates/oryxis-mcp",
]
# The GIF plugin is deliberately OUTSIDE the workspace: it exists to
# keep agg's render stack (gifski, resvg, fontdb) out of the app, and
# a workspace membership would put that stack right back into every
# `cargo check --workspace` and the shared Cargo.lock. It has its own
# lockfile and is built by manifest path in release-gif.yml.
exclude = ["crates/oryxis-gif"]


[workspace.package]
license = "AGPL-3.0-or-later"
authors = ["Wilson Glasser <wilsonglasser@gmail.com>"]
repository = "https://github.com/wilsonglasser/oryxis"

[workspace.dependencies]
# UI
# Tracking the wilsonglasser/iced fork's `oryxis` branch, which is
# `text-selection + monitor-position` merged into one tree so the app
# can use both upstream-bound features at once. Each underlying branch
# stays clean for its own PR.
iced = { git = "https://github.com/wilsonglasser/iced", branch = "oryxis", features = ["canvas", "tokio", "advanced", "image", "svg", "markdown", "highlighter"] }

# SSH
# `des` enables 3des-cbc, needed for the per-host legacy-cipher override
# (the rest of the legacy algorithms ship in russh's default set, just
# off by default in `Preferred`).
russh = { version = "0.62.5", features = ["des"] }

# Terminal parsing
# Our fork's master: upstream tracking plus the windows-sys 0.61 bump,
# which upstream still has at 0.59.
alacritty_terminal = { git = "https://github.com/wilsonglasser/alacritty" }
vte = "0.15"

# PTY
portable-pty = "0.9"

# Font shaping
cosmic-text = "0.18"

# Crypto
age = "0.11"
# Pinned exact like ssh-key's rc: this is the KDF the vault master key and
# the sync group secret are derived with, so the version is part of the
# format. 0.6's defaults are identical to 0.5's (Argon2id v0x13, 19 MiB,
# t=2, p=1, 32-byte output) and the derived key is byte-for-byte the same,
# which `sync_secret_unchanged_by_tuning` proves against its golden vector.
# The rc is already in the build via ssh-key; this stops us carrying both.
argon2 = "=0.6.0-rc.8"
# `rand_core` re-exports the matching `RngCore` trait for `aead::OsRng`,
# so crates can drive the AEAD RNG without pinning the `rand` crate version.
chacha20poly1305 = { version = "0.11", features = ["rand_core"] }

# P2P Sync. The three of them default to `ring` for crypto, and we used to
# take it: rustls with the feature spelled out, quinn and rcgen through
# their defaults. That put a SECOND crypto backend in the binary, because
# russh already links aws-lc-rs, so every build carried both. aws-lc-rs is
# also what rustls 0.23 defaults to now, so this is the tree following the
# ecosystem rather than pinning against it, and `ring` leaves the lock with
# the windows-sys 0.52 line it was holding. `prefer-post-quantum` comes back
# with the default set: it makes the QUIC handshake offer X25519MLKEM768
# first, which ring cannot do at all.
# `platform-verifier` is dropped from quinn's default set on purpose: it
# pulls rustls-platform-verifier, whose own default is `ring`, which alone
# kept that backend in the tree. Nothing here calls it, because the sync
# transport builds its own `ClientConfig` with a custom verifier (peers
# present self-signed certs pinned by device identity, not a CA chain).
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std"] }
# Telnet over TLS (`telnets`, port 992). Same provider as everything else
# above, and no default features so the `ring` backend never comes back in
# through a transitive default set.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
mdns-sd = "0.20"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "3", features = ["rand_core", "serde"] }
rand = "0.8"
base64 = "0.23"
bincode = "1"
hex = "0.4"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zeroize = "1"

# Internal crates
oryxis-core = { path = "crates/oryxis-core" }
oryxis-ssh = { path = "crates/oryxis-ssh" }
oryxis-archive = { path = "crates/oryxis-archive" }
oryxis-telnet = { path = "crates/oryxis-telnet" }
oryxis-mosh = { path = "crates/oryxis-mosh" }
oryxis-serial = { path = "crates/oryxis-serial" }
oryxis-zmodem = { path = "crates/oryxis-zmodem" }
oryxis-terminal = { path = "crates/oryxis-terminal" }
oryxis-vault = { path = "crates/oryxis-vault" }
oryxis-biometric = { path = "crates/oryxis-biometric" }
oryxis-plugin-protocol = { path = "crates/oryxis-plugin-protocol" }

[profile.dev]
# Line-tables-only debuginfo: keeps file:line in panic backtraces while
# dropping the full local-variable info a step debugger would need. Shrinks
# the dev binary from ~750 MB to a fraction of that, which (with the lld
# linker in .cargo/config.toml) makes the final binary link, the slow "1
# item" at the end of every build, dramatically faster. Bump back to 2 if
# you need gdb/lldb variable inspection.
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.release-with-split-debuginfo-packed]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"

# Linux counterpart of the Windows `.pdb` build above. `strip = true` on
# the release profile is what turned the one field gdb backtrace we ever
# got for issue #104 into 30 threads of `??`, with no way back: nightly
# assets roll, so the binary those addresses belonged to was gone hours
# later. The nightly Linux jobs build with this profile and split the
# result with objcopy: the published binary carries no more symbols than
# `strip = true` left it (only an added `.gnu_debuglink` naming its
# symbol file), and the symbols ride along as their own asset.
# `line-tables-only` buys file:line on top of the function names in
# `.symtab` without the size of full DWARF.
#
# gdb validates the debuglink CRC, so a symbols file from a DIFFERENT
# nightly is refused rather than silently misread. Whoever collects a
# stack has to grab the binary and its `-debug.tar.xz` in one sitting.
[profile.release-with-symbols]
inherits = "release"
strip = false
debug = "line-tables-only"

# serialport reaches us through tokio-serial / mio-serial, so the only way
# to move it is a patch. Our fork is upstream main plus windows-sys 0.61
# (upstream is on 0.52, the oldest line left in the Windows build).
[patch.crates-io]
serialport = { git = "https://github.com/wilsonglasser/serialport-rs" }

# arboard reaches us through iced_winit, and published 3.6.1 caps at
# windows-sys <0.61, which alone was holding a second windows-sys in the
# Windows build: with it pinned here, a from-scratch resolve reaches ONE.
# Upstream master already declares <0.62 and simply has not been released,
# so this needs no patch of ours; it points straight at them while we
# validate, and becomes a fork of our own only if it has to stay.
arboard = { git = "https://github.com/1Password/arboard" }

# The last edge holding `windows` 0.61 in the lock: notify-rust (our
# non-Windows notification backend) declares winrt-notification ^0.7, and
# the 0.7 line pins `windows` 0.61. The edge never compiles here, since
# notify-rust is cfg(not(windows)), but the LOCK is the union of every
# target, so 0.61 sat there available for the resolver to hand to
# gpu-allocator, whose own range (>=0.53, <=0.62) accepts either. That is
# the exact accident 25ae5b27 and 967d7c5d fixed by hand, and a plain
# `cargo update` re-created it. Our fork is 0.7.3 with `windows` bumped to
# 0.62 and `on_activated` keeping its `FnMut` bound, so it satisfies ^0.7
# honestly; upstream's own 0.8 does the bump but breaks that bound. With
# 0.61 out of the lock the wrong answer stops existing, which beats
# detecting it after the fact.
tauri-winrt-notification = { git = "https://github.com/wilsonglasser/winrt-notification", branch = "windows-0.62" }
